<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمدون ستور | Ahmadon Store</title>
    <!-- خط تجوال العربي العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- مكتبة Tailwind للتصميم العصري -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / الشريط العلوي -->
    <header class="gradient-header shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-white text-2xl font-bold tracking-wide">
                <i class="fas fa-shopping-bag ml-2"></i> أحمدون ستور
            </div>
            <div class="flex items-center space-x-6 text-white">
                <button onclick="alert('صفحة تسجيل الدخول قادمة قريباً')" class="hover:text-blue-200 transition"><i class="fas fa-user"></i> دخول الأدمن</button>
                <button class="relative hover:text-blue-200 transition">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero-banner bg-white mb-8">
        <div class="container mx-auto px-4 py-12 flex flex-col-reverse md:flex-row items-center justify-between">
            <div class="md:w-1/2 text-right mt-6 md:mt-0">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 leading-tight">أهلاً بك في عالم <br><span class="text-blue-600">التجارة الإلكترونية</span></h1>
                <p class="text-gray-600 text-lg mb-6">اكتشف أفضل المنتجات بأسعار تنافسية مع خدمة توصيل سريعة وآمنة.</p>
                <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" class="bg-blue-600 text-white px-8 py-3 rounded-lg shadow-md hover:bg-blue-700 transition transform hover:scale-105">
                    تسوّق الآن
                </button>
            </div>
            <div class="md:w-1/2 flex justify-center">
                 <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" alt="Shopping" class="w-3/4 opacity-90 drop-shadow-xl">
            </div>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="container mx-auto px-4 py-12">
        <h2 class="text-3xl font-bold text-gray-800 mb-8 border-r-4 border-blue-600 pr-4">منتجاتنا المميزة 🔥</h2>
        
        <!-- Loading State -->
        <div id="loading-spinner" class="text-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
            <p class="mt-4 text-gray-500">جاري تحميل العروض الخاصة...</p>
        </div>

        <!-- Products Container -->
        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 hidden">
            <!-- سيتم ملء المنتجات هنا بواسطة JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white pt-12 pb-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <h3 class="font-bold mb-4">© 2024 جميع الحقوق محفوظة لمنصة أحمدون</h3>
            <p class="text-gray-400 text-sm">تم التطوير بجد وإبداع</p>
        </div>
    </footer>

    <script>
        // رابط السيرفر الخاص بك (آلياً)
        const API_URL = window.location.origin; 
        
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const data = await res.json();
                
                document.getElementById('loading-spinner').classList.add('hidden');
                const container = document.getElementById('products-container');
                container.classList.remove('hidden');
                
                if(data.length === 0) {
                    container.innerHTML = '<p class="col-span-4 text-center text-gray-500 text-xl">لا توجد منتجات حالياً، قم بإضافتها من لوحة التحكم 👋</p>';
                    return;
                }

                container.innerHTML = data.map(product => `
                    <div class="bg-white rounded-xl shadow hover-card overflow-hidden transition duration-300 group">
                        <div class="relative h-48 bg-gray-100 flex items-center justify-center overflow-hidden">
                             <i class="fas fa-box text-6xl text-gray-300 group-hover:text-blue-600 transition duration-500"></i>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-lg mb-2 text-gray-800">${product.name || 'منتج مميز'}</h3>
                            <p class="text-gray-500 text-sm mb-4 line-clamp-2">${product.description || 'اضغط لإضافة وصف للمنتج'}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-xl font-bold text-blue-600">$${product.price || 0}</span>
                                <button onclick="addToCart()" class="bg-green-500 text-white p-2 rounded-lg hover:bg-green-600 transition shadow-md">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error fetching products", error);
                document.getElementById('loading-spinner').innerHTML = '<p class="text-red-500">تعذر تحميل المنتجات، تأكد من تشغيل السيرفر.</p>';
            }
        }

        function addToCart() {
            const countEl = document.getElementById('cart-count');
            let current = parseInt(countEl.innerText);
            countEl.innerText = current + 1;
            alert('تمت الإضافة للسلة بنجاح! ✅');
        }

        fetchProducts();
    </script>
</body>
</html>
