<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أحمدون ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; background-color: #f9fafb; color: #1a1a1a; }
        
        /* Header */
        header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .nav-btn { background: #fbbf24; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Grid */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        /* Card */
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { height: 200px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 3em; color: #9ca3af; }
        .card-body { padding: 20px; }
        .price { font-size: 1.5em; color: #dc2626; font-weight: bold; }
        .btn-add { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        
        /* Loading */
        .loading { text-align: center; padding: 50px; color: #666; font-size: 1.2em; }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ متجر أحمدون الإلكتروني</h1>
        <p>أفضل المنتجات بأفضل الأسعار</p>
    </header>

    <div class="container">
        <h2>منتجاتنا المميزة 🔥</h2>
        <div id="loading" class="loading">جاري تحميل المنتجات...</div>
        <div id="products" class="grid"></div>
    </div>

    <script>
        // رابط السيرفر الخاص بك (سيتم تحديثه عند النشر)
        const API_URL = window.location.origin; 

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('products');
                
                if (products.length === 0) {
                    container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد منتجات حالياً. يرجى إضافتها من لوحة التحكم.</p>';
                    return;
                }

                container.innerHTML = products.map(product => `
                    <div class="card">
                        <div class="card-img"><i class="fas fa-cube"></i></div>
                        <div class="card-body">
                            <h3>${product.name || 'منتج مميز'}</h3>
                            <p style="color:#666; font-size:0.9em;">${product.description || ''}</p>
                            <div class="price">$${product.price || 0}</div>
                            <button class="btn-add" onclick="addToCart(${product.id})">
                                <i class="fas fa-cart-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('loading').innerText = 'حدث خطأ أثناء تحميل المنتجات. تأكد من تشغيل السيرفر.';
            }
        }

        function addToCart(productId) {
            alert(`تمت إضافة المنتج رقم ${productId} للسلة بنجاح! ✅`);
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
